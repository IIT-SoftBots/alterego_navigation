/**:
  ros__parameters:
    use_sim_time: false
    slam_mode: mapping
    map_file_name: ""
    #map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: false

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: scan

    mode: mapping
    debug_logging: false
