TebLocalPlannerROS:

 odom_frame: odom
 map_frame: map
 transform_tolerance: 0.5    

    
 # Trajectory
  
 teb_autosize: True
 dt_ref: 0.3
 dt_hysteresis: 0.1
 global_plan_overwrite_orientation: True
 max_global_plan_lookahead_dist: 0.2  # Ridotto da 0.3 per seguire più da vicino il piano globale
 selection_prefer_initial_plan: 0.95  # Aumentato a 0.95 per preferire fortemente il piano globale iniziale
 weight_viapoint: 10.0  # Aumentare per incentivare il seguire i punti del global plan
 global_plan_viapoint_sep: 0.1  # Distanza tra i via-points estratti dal global plan
 via_points_ordered: True  # Forza l'ordine dei via points
 feasibility_check_no_poses: 2         # Controlla solo le prime pose
 global_plan_prune_distance: 0.1       # Rimuove i punti superati

 # Robot
         
 max_vel_x: 100
 max_vel_x_backwards: 0.9
 max_vel_theta: 8
 acc_lim_x: 9
 acc_lim_y: 0.0
 acc_lim_theta: 0.5
 min_turning_radius: 0.0
 footprint_model: # types: "point", "circular", "two_circles", "line", "polygon"
   type: "polygon" #"circular" 
   vertices: [[0.225, -0.35], [-0.225, -0.35], [-0.225, 0.35], [0.225, 0.35]] # for type "polygon"
 holonomic_robot: false 
 min_in_place_vel_theta: 0.6           # velocità angolare minima per la rotazione in place [rad/s]
 escape_vel: -0.7                    # velocità di fuga in caso di blocco [m/s]
 wheelbase: 0.30                       # distanza tra le ruote [m]

 # GoalTolerance
    
 xy_goal_tolerance: 0.1
 yaw_goal_tolerance: 0.05
 free_goal_vel: False
 oscillation_recovery: true
 oscillation_v_eps: 0.1      # Velocity threshold to detect oscillations
 oscillation_omega_eps: 0.1  # Angular velocity threshold
 oscillation_recovery_min_duration: 5.0  # Minimum duration for triggering recovery
 oscillation_filter_duration: 5.0  # Duration for filtering oscillations
 
 recovery_behavior_enabled: true
    
 # Obstacles
    
 min_obstacle_dist: 0.2
 inflation_dist: 0.02
 dynamic_obstacle_inflation_dist: 0.1
 include_costmap_obstacles: True
 costmap_obstacles_behind_robot_dist: 0.3
 obstacle_poses_affected: 15
 costmap_converter_plugin: ""
 costmap_converter_spin_thread: True
 costmap_converter_rate: 5

 # Optimization
    
 no_inner_iterations: 5
 no_outer_iterations: 4
 optimization_activate: True
 optimization_verbose: False
 penalty_epsilon: 0.1
 weight_max_vel_x: 10
 weight_max_vel_theta: 1
 weight_acc_lim_x: 0.5
 weight_acc_lim_theta: 1
 weight_kinematics_nh: 1000
 weight_kinematics_forward_drive: 100
 weight_kinematics_turning_radius: 1
 weight_obstacle: 30
 weight_dynamic_obstacle: 10 # not in use yet
 alternative_time_cost: False # not in use yet
 weight_path_smoothing: 0.3  # Disattivato per aderire meglio al piano globale
 weight_optimaltime: 1.0     # Ridotto per dare meno peso all'ottimizzazione del tempo

  
 # Homotopy Class Planner

 enable_homotopy_class_planning: True
 enable_multithreading: True
 simple_exploration: False
 max_number_classes: 2
 roadmap_graph_no_samples: 15
 roadmap_graph_area_width: 5
 h_signature_prescaler: 0.5
 h_signature_threshold: 0.1
 obstacle_keypoint_offset: 0.1
 obstacle_heading_threshold: 0.45
 visualize_hc_graph: False

 publish_feedback: true #false
 