local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 5.0  # Reduced from 10.0
  publish_frequency: 5.0  # Reduced from 10.0
  rolling_window: true
  width: 2.0  # Reduced from 5.0
  height: 2.0  # Reduced from 5.0
  resolution: 0.1  # Increased from 0.05 (less detailed but faster)
  observation_persistence: 0.0
  static_map: false        # Cambiato da false a true per usare la mappa statica
  cost_scaling_factor: 4.0


  plugins:
  # - {name: static_layer, type: "costmap_2d::StaticLayer"}  # Aggiunto layer statico
  - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  # static_layer:
  #   map_topic: map  # Stesso topic usato nella global costmap
  #   subscribe_to_updates: true
  #   track_unknown_space: true

  obstacle_layer:
    max_obstacle_height: 1.0
    min_obstacle_height: 0.1
    observation_sources: laser_scan_sensor
    laser_scan_sensor: {sensor_frame: scan, data_type: LaserScan, topic: scan, marking: true, clearing: true}

  inflation_layer:
    inflation_radius: 0.15  # Reduced from 0.2
    cost_scaling_factor: 10.0  # Increased from 10.0 to decay costs more quickly